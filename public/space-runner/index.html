<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.3);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        #score {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(0, 200, 255, 0.4);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            transition: opacity 0.5s;
        }

        #overlay h1 {
            font-size: 48px;
            color: #00c8ff;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.8);
            margin-bottom: 10px;
        }

        #overlay p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
        }

        #overlay .final-score {
            color: #ff6b9d;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 107, 157, 0.6);
        }

        #startBtn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #00c8ff, #0080ff);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.4);
        }

        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.7);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="score">Score: 0</div>
    </div>

    <div id="overlay">
        <h1>Space Runner</h1>
        <p>Уклоняйся от астероидов, собирай звёзды!</p>
        <div class="final-score" id="finalScore"></div>
        <button id="startBtn">Играть</button>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');

        canvas.width = 800;
        canvas.height = 600;

        let gameRunning = false;
        let score = 0;
        let animFrame;
        let difficulty = 1;

        // Player
        const player = {
            x: 400,
            y: 500,
            width: 40,
            height: 50,
            speed: 6,
            trail: []
        };

        // Game objects
        let asteroids = [];
        let stars = [];
        let particles = [];
        let bgStars = [];

        // Input
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);

        // Touch / mouse
        let targetX = player.x;
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            targetX = e.clientX - rect.left;
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            targetX = e.touches[0].clientX - rect.left;
        });

        // Initialize background stars
        function initBgStars() {
            bgStars = [];
            for (let i = 0; i < 150; i++) {
                bgStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    alpha: Math.random()
                });
            }
        }

        function spawnAsteroid() {
            const size = Math.random() * 30 + 20;
            asteroids.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 2 + 1.5 + difficulty * 0.3,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.05,
                vertices: generateAsteroidShape(size)
            });
        }

        function generateAsteroidShape(size) {
            const points = [];
            const numPoints = 8 + Math.floor(Math.random() * 5);
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const r = size / 2 * (0.7 + Math.random() * 0.3);
                points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
            }
            return points;
        }

        function spawnStar() {
            stars.push({
                x: Math.random() * (canvas.width - 20) + 10,
                y: -20,
                size: 12,
                speed: Math.random() * 1.5 + 1,
                pulse: 0,
                pulseDir: 1
            });
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 1,
                    color: color,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.01
                });
            }
        }

        function update() {
            // Move player
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

            // Mouse/touch smoothing
            const dx = targetX - player.x;
            if (Math.abs(dx) > 5) player.x += dx * 0.08;

            // Boundaries
            player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));

            // Player trail
            player.trail.push({ x: player.x, y: player.y + player.height / 2, alpha: 1 });
            if (player.trail.length > 15) player.trail.shift();
            player.trail.forEach(t => t.alpha -= 0.07);

            // Background stars
            bgStars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
                s.alpha = 0.5 + Math.sin(Date.now() * 0.003 + s.x) * 0.3;
            });

            // Asteroids
            asteroids.forEach(a => {
                a.y += a.speed;
                a.rotation += a.rotSpeed;
            });
            asteroids = asteroids.filter(a => a.y < canvas.height + a.size);

            // Stars (collectibles)
            stars.forEach(s => {
                s.y += s.speed;
                s.pulse += 0.05 * s.pulseDir;
                if (s.pulse > 1 || s.pulse < 0) s.pulseDir *= -1;
            });
            stars = stars.filter(s => s.y < canvas.height + 20);

            // Particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                p.vy += 0.05;
            });
            particles = particles.filter(p => p.life > 0);

            // Collision with asteroids
            for (let a of asteroids) {
                const dist = Math.hypot(player.x - a.x, player.y - a.y);
                if (dist < a.size / 2 + player.width / 3) {
                    createExplosion(player.x, player.y, '#ff4444', 30);
                    createExplosion(player.x, player.y, '#ffaa00', 20);
                    gameOver();
                    return;
                }
            }

            // Collision with stars
            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];
                const dist = Math.hypot(player.x - s.x, player.y - s.y);
                if (dist < s.size + player.width / 2) {
                    score += 10;
                    scoreEl.textContent = `Score: ${score}`;
                    createExplosion(s.x, s.y, '#ffdd00', 15);
                    createExplosion(s.x, s.y, '#00ffaa', 10);
                    stars.splice(i, 1);
                }
            }

            // Difficulty increases over time
            difficulty = 1 + score / 100;

            // Spawn logic
            if (Math.random() < 0.02 + difficulty * 0.005) spawnAsteroid();
            if (Math.random() < 0.015) spawnStar();
        }

        function draw() {
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0020');
            gradient.addColorStop(0.5, '#0d0035');
            gradient.addColorStop(1, '#1a0040');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background stars
            bgStars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Player trail (engine glow)
            player.trail.forEach((t, i) => {
                if (t.alpha <= 0) return;
                const grd = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 10);
                grd.addColorStop(0, `rgba(0, 200, 255, ${t.alpha * 0.6})`);
                grd.addColorStop(1, `rgba(0, 100, 255, 0)`);
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.arc(t.x, t.y, 10, 0, Math.PI * 2);
                ctx.fill();
            });

            // Player ship
            ctx.save();
            ctx.translate(player.x, player.y);

            // Glow effect
            ctx.shadowColor = '#00c8ff';
            ctx.shadowBlur = 20;

            // Ship body
            ctx.fillStyle = '#00c8ff';
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2);
            ctx.lineTo(-player.width / 2, player.height / 2);
            ctx.lineTo(-player.width / 4, player.height / 3);
            ctx.lineTo(0, player.height / 2.5);
            ctx.lineTo(player.width / 4, player.height / 3);
            ctx.lineTo(player.width / 2, player.height / 2);
            ctx.closePath();
            ctx.fill();

            // Ship highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2);
            ctx.lineTo(-player.width / 4, player.height / 4);
            ctx.lineTo(0, player.height / 5);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.restore();

            // Engine fire
            const fireSize = 5 + Math.random() * 8;
            const grd = ctx.createRadialGradient(player.x, player.y + player.height / 2 + fireSize / 2, 0, player.x, player.y + player.height / 2 + fireSize / 2, fireSize);
            grd.addColorStop(0, 'rgba(255, 200, 50, 0.9)');
            grd.addColorStop(0.5, 'rgba(255, 100, 0, 0.5)');
            grd.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(player.x, player.y + player.height / 2 + fireSize / 2, fireSize, 0, Math.PI * 2);
            ctx.fill();

            // Asteroids
            asteroids.forEach(a => {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rotation);

                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#553333';
                ctx.strokeStyle = '#aa4444';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(a.vertices[0].x, a.vertices[0].y);
                for (let i = 1; i < a.vertices.length; i++) {
                    ctx.lineTo(a.vertices[i].x, a.vertices[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.restore();
            });

            // Stars (collectibles)
            stars.forEach(s => {
                ctx.save();
                ctx.translate(s.x, s.y);

                const glow = 10 + s.pulse * 5;
                ctx.shadowColor = '#ffdd00';
                ctx.shadowBlur = glow;

                ctx.fillStyle = '#ffdd00';
                drawStar(ctx, 0, 0, 5, s.size, s.size / 2);

                ctx.shadowBlur = 0;
                ctx.restore();
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            animFrame = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            difficulty = 1;
            scoreEl.textContent = 'Score: 0';
            player.x = canvas.width / 2;
            player.y = 500;
            player.trail = [];
            targetX = player.x;
            asteroids = [];
            stars = [];
            particles = [];
            initBgStars();

            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            gameRunning = true;
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animFrame);
            finalScoreEl.textContent = `Очки: ${score}`;
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = '1', 10);
            startBtn.textContent = 'Играть снова';
        }

        startBtn.addEventListener('click', startGame);

        // Initial background animation
        initBgStars();
        function idleDraw() {
            if (gameRunning) return;
            bgStars.forEach(s => {
                s.y += s.speed * 0.5;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            });
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0020');
            gradient.addColorStop(0.5, '#0d0035');
            gradient.addColorStop(1, '#1a0040');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            bgStars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + Math.sin(Date.now() * 0.002 + s.x) * 0.3})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(idleDraw);
        }
        idleDraw();
    </script>
</body>
</html>
